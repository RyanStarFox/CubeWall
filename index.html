<style>
  :root {

    --text: #e7e9ee;

    --accent: #6aa9ff;
    --on-accent: #10131a;

  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.5 var(--font);
    background: var(--bg);
    color: var(--text);
  }
  .app { display: grid; grid-template-columns: 480px 1fr; min-height: 100vh; }
  .controls {
    padding: 20px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
    max-height: 100vh;
  }
  .brand, .drop-group, .panes, .export { flex-shrink: 0; }
  .pane.is-open { flex: 1; min-height: 0; overflow: auto; }
  .stage { padding: 24px; overflow: auto; }
  .brand { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .brand h1 { flex: 1; min-width: 0; }
  .brand-tools { display: flex; gap: 8px; width: 100%; }
  .lang {
    display: flex; min-width: 0;
    border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  }
  #langSwitch { flex: 2; }
  #themeSwitch { flex: 3; }
  .lang button {
    flex: 1; min-width: 0; padding: 3px 4px; font-size: 11px; line-height: 1.3;
    border: none; border-radius: 0; background: transparent; text-align: center;
  }
  .lang button.active { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .brand .gh {
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); flex-shrink: 0;
  }
  .brand .gh:hover { color: var(--accent); }
  noscript p { margin: 0; padding: 12px 16px; background: var(--panel); color: var(--text); }
  h1 { font-size: 16px; margin: 0; letter-spacing: .5px; }
  h2 { font-size: 12px; margin: 0 0 8px; color: var(--muted); font-weight: 600; letter-spacing: .08em; }
  .group { border-top: 1px solid var(--line); padding-top: 16px; }
  .group:first-of-type { border-top: none; padding-top: 0; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input[type="number"], select {
    width: 100%;
    padding: 7px 8px;
    background: var(--input);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    font: inherit;
  }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; min-width: 0; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 13px; }
  .check input { accent-color: var(--accent); }
  button {
    padding: 8px 12px;
    background: var(--btn);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  .drop {
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 20px 12px;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
  }
  .drop.over { border-color: var(--accent); color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); }
  .swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .swatch {
    position: relative;
    border: 2px solid transparent;
    border-radius: 6px;
    padding: 6px 4px 4px;
    background: var(--input);
    cursor: pointer;
    text-align: center;
  }
  .swatch.selected { border-color: var(--accent); }
  .swatch .chip { height: 26px; border-radius: 4px; border: 1px solid var(--chip-edge); }
  .swatch .name { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .swatch .hex {
    display: block; width: 100%; margin-top: 4px; padding: 2px 4px;
    background: var(--inset); color: var(--text); border: 1px solid var(--line);
    border-radius: 3px; font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    text-align: center; letter-spacing: .02em;
  }
  .swatch .edit-color {
    display: block; width: 100%; height: 22px; margin-top: 4px; padding: 0;
    border: 1px solid var(--line); border-radius: 3px; cursor: pointer;
  }
  .picker {
    position: fixed; z-index: 30; width: 200px; padding: 10px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 10px 28px rgba(0,0,0,.28);
  }
  .picker[hidden] { display: none; }
  .picker-sv {
    display: block; width: 100%; height: 128px; border-radius: 4px;
    cursor: crosshair; border: 1px solid var(--line);
  }
  .picker-hue {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 12px; margin: 10px 0 0; padding: 0;
    border: 1px solid var(--line); border-radius: 6px;
    background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
  }
  .picker-hue::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: var(--text); border: 2px solid var(--panel); cursor: pointer;
  }
  .picker-hue::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--text); border: 2px solid var(--panel); cursor: pointer;
  }
  .tools { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .layer {
    display: flex; align-items: center; gap: 8px; padding: 6px;
    border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px;
    background: var(--input); cursor: pointer;
  }
  .layer.selected { border-color: var(--accent); }
  .layer img { width: 30px; height: 30px; object-fit: cover; border-radius: 3px; background: #000; }
  .layer .lname { flex: 1; min-width: 0; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer button { padding: 2px 6px; font-size: 12px; line-height: 1.2; }
  .tools button.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .4; cursor: default; }
  button:disabled:hover { border-color: var(--line); }
  #canvasWrap { display: inline-block; background: var(--canvas-pad); padding: 12px; border-radius: 8px; border: 1px solid var(--line); max-width: 100%; }
  #canvasWrap[hidden] { display: none; }
  canvas { display: block; max-width: 100%; height: auto; image-rendering: pixelated; cursor: crosshair; touch-action: none; }

  .panes { display: flex; }
  .panes button { padding: 8px 4px; font-size: 13px; }
  .pane { display: none; flex-direction: column; gap: 20px; }
  .pane.is-open { display: flex; }
  .pane .group:first-child { border-top: none; padding-top: 0; }

    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin: 0 0 12px;
  }
  .brush-chip {
    height: 36px; border: 2px solid transparent; border-radius: 6px; padding: 0;
    box-shadow: inset 0 0 0 1px var(--chip-edge);
  }
  .brush-chip.selected { border-color: var(--accent); }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .warn { color: var(--warn); font-size: 12px; }

function detectLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved === 'zh' || saved === 'en') return saved;
  } catch { /* 隐私模式：只看浏览器语言 */ }
  return (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}

let lang = detectLang();

function t(key, vars) {
  let s = I18N[lang]?.[key] ?? I18N.zh[key] ?? key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
  return s;
}

const colorNames = () => t('colorList').split(',');

function setMeta(selector, value) {
  const el = document.querySelector(selector);
  if (el) el.setAttribute('content', value);
}

function applySeo() {
  const title = t('metaTitle');
  const desc = t('metaDescription');
  const imgAlt = t('ogImageAlt');
  document.title = title;
  setMeta('meta[name="description"]', desc);
  setMeta('meta[name="keywords"]', t('metaKeywords'));
  setMeta('meta[name="application-name"]', t('title'));
  setMeta('meta[property="og:title"]', title);
  setMeta('meta[property="og:description"]', desc);
  setMeta('meta[property="og:site_name"]', t('title'));
  setMeta('meta[property="og:locale"]', lang === 'zh' ? 'zh_CN' : 'en_US');
  setMeta('meta[property="og:image:alt"]', imgAlt);
  setMeta('meta[name="twitter:title"]', title);
  setMeta('meta[name="twitter:description"]', desc);
  setMeta('meta[name="twitter:image:alt"]', imgAlt);
  const ldEl = document.getElementById('jsonld');
  if (!ldEl) return;
  try {
    const data = JSON.parse(ldEl.textContent);
    data.name = t('title');
    data.description = desc;
    ldEl.textContent = JSON.stringify(data);
  } catch { /* 结构化数据保持页面里的静态默认值 */ }
}

function applyStaticLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  applySeo();
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  document.querySelectorAll('#langSwitch button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  syncThemeButton();
}

function loadThemePref() {
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (THEMES.includes(saved)) return saved;
  } catch { /* 隐私模式：只跟系统 */ }
  return 'auto';
}

let themePref = loadThemePref();

function applyTheme() {
  if (themePref === 'light' || themePref === 'dark') {
    document.documentElement.dataset.theme = themePref;
    try { localStorage.setItem(THEME_KEY, themePref); } catch { /* 隐私模式：仅本次会话 */ }
  } else {
    delete document.documentElement.dataset.theme;
    try { localStorage.removeItem(THEME_KEY); } catch { /* 忽略 */ }
  }
  syncThemeButton();
}

function syncThemeButton() {
  document.querySelectorAll('#themeSwitch [data-theme]').forEach(b => {
    b.classList.toggle('active', b.dataset.theme === themePref);
  });
}

/* ---------- 调色板 ---------- */
const PALETTE_KEY = 'cubewall.palette.v1';
const DEFAULT_COLORS = ['#FFFFFF', '#FFD500', '#0051BA', '#009E60', '#C41E3A', '#FF5800'];

function loadPalette() {
  try {
    const raw = localStorage.getItem(PALETTE_KEY);
    const parsed = raw && JSON.parse(raw);
    const colors = parsed && parsed.colors;
    if (Array.isArray(colors) && colors.length === 6 && colors.every(c => /^#[0-9a-f]{6}$/i.test(c))) {
      return colors.slice();
    }
  } catch { /* 损坏或不可用时退回默认色 */ }
  return DEFAULT_COLORS.slice();
}

function savePalette(colors) {
  try { localStorage.setItem(PALETTE_KEY, JSON.stringify({ colors })); } catch { /* 隐私模式下仅本次会话生效 */ }
}

/* ---------- 颜色空间 ---------- */
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function rgbToHex(r, g, b) {
  return `#${[r, g, b].map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase()}`;
}

function rgbToHsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d) {
    if (max === r) h = ((g - b) / d + (g < b ? 6 : 0));
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return [h, max === 0 ? 0 : d / max, max];
}

function hsvToRgb(h, s, v) {
  const f = n => {
    const k = (n + h / 60) % 6;
    return Math.round((v - v * s * Math.max(Math.min(k, 4 - k, 1), 0)) * 255);
  };
  return [f(5), f(3), f(1)];
}

const srgbToLinear = v => { v /= 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };

// 误差扩散在线性光空间进行：远看这面墙时，人眼平均的是光量而不是 sRGB 数值。
function labFromLinear(R, G, B) {
  const x = (R * 0.4124 + G * 0.3576 + B * 0.1805) / 0.95047;
  const y = (R * 0.2126 + G * 0.7152 + B * 0.0722);
  const z = (R * 0.0193 + G * 0.1192 + B * 0.9505) / 1.08883;
  const k = v => v > 0.008856 ? Math.cbrt(v) : (7.787 * v + 16 / 116);
  const [fx, fy, fz] = [k(x), k(y), k(z)];
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
}

// 明度权重。1.5 是实测上限：再高会把暗橙也推成红色。
const L_WEIGHT = 1.5;

/* ---------- 状态 ---------- */
const state = {
  colors: loadPalette(),
  order: 3,
  cubesX: 10,
  cubesY: 10,
  sizeTouched: false,
  fitMode: 'contain',
  padColor: 0,
  ditherStrength: 0,
  brush: 0,
  tool: 'brush',
  mode: 'layout',
  layoutTool: 'move',
  // 每个图层：{id, img, name, x, y, w, h, zoom, ox, oy}
  // x/y/w/h 是贴纸坐标（墙的显示大小会变，但「占第几列贴纸」是恒定的）；
  // zoom/ox/oy 只是取景变换，原图始终完整保留，所以裁切可逆。
  layers: [],
  selected: null,
  grid: null,   // Uint8Array，长度 W*H，值为调色板下标
};

const gridW = () => state.cubesX * state.order;
const gridH = () => state.cubesY * state.order;
const activeLayer = () => state.layers.find(l => l.id === state.selected) || null;

// 图层里那张图实际被画到墙上的矩形。zoom=1 时按 fitMode 的基准铺，
// 之后叠加用户的缩放与平移；返回值仍是贴纸坐标。
function layerDrawRect(L) {
  const iw = L.img.width, ih = L.img.height;
  const base = state.fitMode === 'contain'
    ? Math.min(L.w / iw, L.h / ih)
    : Math.max(L.w / iw, L.h / ih);
  const s = base * L.zoom;
  const dw = iw * s, dh = ih * s;
  return { dx: L.x + (L.w - dw) / 2 + L.ox, dy: L.y + (L.h - dh) / 2 + L.oy, dw, dh };
}

// 图纸标题上的来源说明：单图报文件名，多图只报张数，避免拼一长串
function sourceLabel() {
  if (state.layers.length === 0) return '';
  if (state.layers.length === 1) return state.layers[0].name;
  return t('sourceCollage', { n: state.layers.length });
}

function newLayer(img, name) {
  return { id: Math.random().toString(36).slice(2), img, name, x: 0, y: 0, w: gridW(), h: gridH(), zoom: 1, ox: 0, oy: 0 };
}

/* ---------- 量化 ---------- */
// 把所有图层合成到 W×H 的画布上，再逐像素贴到最近的魔方色。
function quantize() {
  const W = gridW(), H = gridH();
  if (state.layers.length === 0) { state.grid = null; return; }

  const src = document.createElement('canvas');
  src.width = W; src.height = H;
  const sctx = src.getContext('2d', { willReadFrequently: true });
  // 没有图层覆盖的地方、以及图片本身的透明像素，都显示补白色（默认白）
  sctx.fillStyle = state.colors[state.padColor];
  sctx.fillRect(0, 0, W, H);
  sctx.imageSmoothingQuality = 'high';

  // 记录哪些格子真的被图层盖住了，供后面清理补白区用
  const covered = new Uint8Array(W * H);
  for (const L of state.layers) {
    const { dx, dy, dw, dh } = layerDrawRect(L);
    sctx.save();
    sctx.beginPath();
    sctx.rect(L.x, L.y, L.w, L.h);   // 裁到图层框内，放大的图不会溢到邻居身上
    sctx.clip();
    sctx.drawImage(L.img, dx, dy, dw, dh);
    sctx.restore();

    const x0 = Math.max(0, Math.round(Math.max(L.x, dx)));
    const y0 = Math.max(0, Math.round(Math.max(L.y, dy)));
    const x1 = Math.min(W - 1, Math.round(Math.min(L.x + L.w, dx + dw)) - 1);
    const y1 = Math.min(H - 1, Math.round(Math.min(L.y + L.h, dy + dh)) - 1);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) covered[y * W + x] = 1;
  }

  const data = sctx.getImageData(0, 0, W, H).data;
  const linPalette = state.colors.map(c => hexToRgb(c).map(srgbToLinear));
  const labs = linPalette.map(p => labFromLinear(p[0], p[1], p[2]));
  const out = new Uint8Array(W * H);

  // 全部在线性光空间累加误差
  const buf = new Float32Array(W * H * 3);
  for (let i = 0, p = 0; i < W * H; i++, p += 4) {
    buf[i * 3] = srgbToLinear(data[p]);
    buf[i * 3 + 1] = srgbToLinear(data[p + 1]);
    buf[i * 3 + 2] = srgbToLinear(data[p + 2]);
  }

  const nearest = (R, G, B) => {
    const lab = labFromLinear(R, G, B);
    let best = 0, bestD = Infinity;
    for (let k = 0; k < labs.length; k++) {
      // 明度加权：六色里没有黑色，暗部按亮度就近（落到蓝）比按色相就近（落到红）更像原图
      const dL = (lab[0] - labs[k][0]) * L_WEIGHT;
      const d = dL * dL + (lab[1] - labs[k][1]) ** 2 + (lab[2] - labs[k][2]) ** 2;
      if (d < bestD) { bestD = d; best = k; }
    }
    return best;
  };

  const strength = state.ditherStrength;
  const spread = (x, y, er, eg, eb, factor) => {
    if (x < 0 || x >= W || y < 0 || y >= H) return;
    const i = (y * W + x) * 3;
    const f = factor * strength;
    // 截断累积误差，避免局部反差过大时误差滚雪球、把整片区域推成错误的颜色
    buf[i] = Math.min(1.6, Math.max(-0.6, buf[i] + er * f));
    buf[i + 1] = Math.min(1.6, Math.max(-0.6, buf[i + 1] + eg * f));
    buf[i + 2] = Math.min(1.6, Math.max(-0.6, buf[i + 2] + eb * f));
  };

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 3;
      const R = Math.min(1, Math.max(0, buf[i]));
      const G = Math.min(1, Math.max(0, buf[i + 1]));
      const B = Math.min(1, Math.max(0, buf[i + 2]));
      const k = nearest(R, G, B);
      out[y * W + x] = k;
      if (strength > 0) {
        const [pr, pg, pb] = linPalette[k];
        const er = R - pr, eg = G - pg, eb = B - pb;
        spread(x + 1, y, er, eg, eb, 7 / 16);
        spread(x - 1, y + 1, er, eg, eb, 3 / 16);
        spread(x, y + 1, er, eg, eb, 5 / 16);
        spread(x + 1, y + 1, er, eg, eb, 1 / 16);
      }
    }
  }

  // 没被图层覆盖的地方直接写死成补白色。
  // 若任由抖动去量化这片纯色，误差扩散会在边上撒出杂点。
  for (let i = 0; i < out.length; i++) if (!covered[i]) out[i] = state.padColor;
  state.grid = out;
}

/* ---------- 绘制 ---------- */
function columnLabel(index) {
  let s = '';
  let n = index;
  do { s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26) - 1; } while (n >= 0);
  return s;
}

// 同一套绘制逻辑供预览与导出使用，只有 cell 大小不同。
function drawGrid(ctx, cell) {
  const W = gridW(), H = gridH(), N = state.order;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W * cell, H * cell);

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      ctx.fillStyle = state.colors[state.grid[y * W + x]];
      ctx.fillRect(x * cell, y * cell, cell, cell);
    }
  }

  // 细线：贴纸边界
  ctx.strokeStyle = 'rgba(0,0,0,0.22)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= W; x++) { ctx.moveTo(x * cell + .5, 0); ctx.lineTo(x * cell + .5, H * cell); }
  for (let y = 0; y <= H; y++) { ctx.moveTo(0, y * cell + .5); ctx.lineTo(W * cell, y * cell + .5); }
  ctx.stroke();

  // 粗线：每 N 格一个魔方
  const thick = Math.max(2, Math.round(cell / 6));
  ctx.strokeStyle = '#111';
  ctx.lineWidth = thick;
  ctx.beginPath();
  for (let cx = 0; cx <= state.cubesX; cx++) { ctx.moveTo(cx * N * cell, 0); ctx.lineTo(cx * N * cell, H * cell); }
  for (let cy = 0; cy <= state.cubesY; cy++) { ctx.moveTo(0, cy * N * cell); ctx.lineTo(W * cell, cy * N * cell); }
  ctx.stroke();

  // 魔方编号：块太小就不画，避免糊成一团
  const block = N * cell;
  if (block >= 34) {
    ctx.font = `${Math.max(9, Math.round(block / 5))}px ${UI_FONT}`;
    ctx.textBaseline = 'top';
    for (let cy = 0; cy < state.cubesY; cy++) {
      for (let cx = 0; cx < state.cubesX; cx++) {
        const label = `${cy + 1}-${columnLabel(cx)}`;
        const px = cx * block + 3, py = cy * block + 2;
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        ctx.strokeText(label, px, py);
        ctx.fillStyle = '#111';
        ctx.fillText(label, px, py);
      }
    }
  }
}

const canvas = document.getElementById('preview');
const ctx = canvas.getContext('2d');
let previewCell = 16;

function renderPreview() {
  const W = gridW(), H = gridH();
  document.getElementById('cubeInfo').textContent = t('cubeInfo', {
    w: W, h: H, cx: state.cubesX, cy: state.cubesY, n: state.cubesX * state.cubesY,
  });
  document.getElementById('sizeWarn').hidden = Math.max(W, H) <= 300;

  const hasGrid = !!state.grid;
  document.getElementById('canvasWrap').hidden = !hasGrid;
  document.getElementById('empty').hidden = hasGrid;
  if (!hasGrid) {
    document.getElementById('meta').textContent = t('noImage');
    return;
  }

  previewCell = Math.max(6, Math.min(28, Math.floor(1000 / W)));
  canvas.width = W * previewCell;
  canvas.height = H * previewCell;
  canvas.style.width = Math.min(canvas.width, 1000) + 'px';
  repaint();

  document.getElementById('meta').textContent = t('meta', {
    src: sourceLabel() || t('noImage'), w: W, h: H, order: state.order, n: state.cubesX * state.cubesY,
  });
  document.getElementById('sheetTitle').textContent = t('sheetTitle', {
    cx: state.cubesX, cy: state.cubesY, order: state.order,
  });
}

/* ---------- 导出 ---------- */
// 按 A4 短边 300dpi（2480px）估格子边长，大墙受画布上限 8192 卡住。
// 屏幕预览仍用小格子，只有下载/打印走这张图。
function sheetLayout() {
  const W = gridW(), H = gridH();
  const maxPx = 8192, target = 2480;
  const cell = Math.max(24, Math.min(
    128,
    Math.floor((target - 96) / Math.max(W, H)),
    Math.floor((maxPx - 96) / W),
    Math.floor((maxPx - 280) / H)
  ));
  const scale = cell / 24;
  return {
    W, H, cell,
    pad: Math.max(40, Math.round(28 * scale)),
    scale,
    legendH: Math.round(84 * scale),
  };
}

function buildSheet() {
  const { W, H, cell, pad, scale, legendH } = sheetLayout();
  const out = document.createElement('canvas');
  out.width = W * cell + pad * 2;
  out.height = H * cell + pad * 2 + legendH;
  const c = out.getContext('2d');
  c.fillStyle = '#fff';
  c.fillRect(0, 0, out.width, out.height);

  c.save();
  c.translate(pad, pad);
  drawGrid(c, cell);
  c.restore();

  const counts = new Array(6).fill(0);
  for (const v of state.grid) counts[v]++;

  const font = `${Math.round(16 * scale)}px ${UI_FONT}`;
  const fontSm = `${Math.round(14 * scale)}px ${UI_FONT}`;
  const fontXs = `${Math.round(12 * scale)}px ${UI_FONT}`;
  const sw = Math.round(18 * scale);
  const gap = Math.round(22 * scale);
  const baseY = pad + H * cell + Math.round(14 * scale);

  c.fillStyle = '#111';
  c.font = font;
  c.textBaseline = 'top';
  c.fillText(
    t('sheetLine', { w: W, h: H, order: state.order, cx: state.cubesX, cy: state.cubesY, n: state.cubesX * state.cubesY }) +
    (sourceLabel() ? ` · ${sourceLabel()}` : ''),
    pad, baseY
  );

  c.font = fontSm;
  let x = pad;
  for (let i = 0; i < 6; i++) {
    c.fillStyle = state.colors[i];
    c.fillRect(x, baseY + Math.round(30 * scale), sw, sw);
    c.strokeStyle = '#666';
    c.lineWidth = Math.max(1, Math.round(scale));
    c.strokeRect(x + .5, baseY + Math.round(30 * scale) + .5, sw, sw);
    c.fillStyle = '#111';
    const text = `${colorNames()[i]} ${counts[i]}`;
    c.fillText(text, x + sw + Math.round(6 * scale), baseY + Math.round(32 * scale));
    x += sw + Math.round(6 * scale) + c.measureText(text).width + gap;
  }

  c.fillStyle = '#888';
  c.font = fontXs;
  c.fillText('github.com/RyanStarFox/CubeWall', pad, baseY + Math.round(58 * scale));
  return out;
}

/* ---------- 交互 ---------- */
// 墙的尺寸一变，图层的贴纸坐标就失效了，按比例缩放跟上
function resizeWall(mutate) {
  const ow = gridW(), oh = gridH();
  mutate();
  const nw = gridW(), nh = gridH();
  if (!state.layers.length || (nw === ow && nh === oh)) return;
  const sx = nw / ow, sy = nh / oh;
  for (const L of state.layers) {
    L.x = Math.round(L.x * sx);
    L.y = Math.round(L.y * sy);
    L.w = Math.max(1, Math.round(L.w * sx));
    L.h = Math.max(1, Math.round(L.h * sy));
  }
}

function snapCubes(stickers) {
  const N = state.order;
  return Math.max(1, Math.round(stickers / N));
}

function syncSizeInputs() {
  document.getElementById('width').value = gridW();
  document.getElementById('height').value = gridH();
  document.getElementById('width').step = state.order;
  document.getElementById('height').step = state.order;
  document.getElementById('width').min = state.order;
  document.getElementById('height').min = state.order;
}

function refresh() {
  quantize();
  resetHistory();   // 重新量化会覆盖所有手工改动，旧的撤销记录对不上新网格
  renderPreview();
}

function renderBrushRow() {
  const row = document.getElementById('brushRow');
  if (!row) return;
  row.innerHTML = state.colors.map((c, i) =>
    `<button type="button" class="brush-chip${i === state.brush ? ' selected' : ''}" data-i="${i}" style="background:${c}" aria-label="${colorNames()[i]}"></button>`
  ).join('');
}

function syncBrushSelection() {
  document.querySelectorAll('.swatch').forEach(el => {
    el.classList.toggle('selected', Number(el.dataset.i) === state.brush);
  });
  document.querySelectorAll('#brushRow .brush-chip').forEach(el => {
    el.classList.toggle('selected', Number(el.dataset.i) === state.brush);
  });
}

function renderSwatches() {
  document.getElementById('swatches').innerHTML = state.colors.map((c, i) => `
    <div class="swatch ${i === state.brush ? 'selected' : ''}" data-i="${i}">
      <div class="chip" style="background:${c}"></div>
      <div class="name">${colorNames()[i]}</div>
      <input class="hex" type="text" spellcheck="false" maxlength="7" value="${c}" data-color="${i}" aria-label="${colorNames()[i]}">
      <button type="button" class="edit-color" data-color="${i}" style="background:${c}" aria-label="${colorNames()[i]}"></button>
    </div>`).join('');
  renderBrushRow();
}

function paintSwatch(i, hex) {
  const sw = document.querySelector(`.swatch[data-i="${i}"]`);
  if (sw) {
    sw.querySelector('.chip').style.background = hex;
    sw.querySelector('.hex').value = hex;
    sw.querySelector('.edit-color').style.background = hex;
  }
  const chip = document.querySelector(`#brushRow .brush-chip[data-i="${i}"]`);
  if (chip) chip.style.background = hex;
}

function setColor(i, hex, commit = true) {
  state.colors[i] = hex;
  paintSwatch(i, hex);
  if (!commit) return;
  savePalette(state.colors);
  refresh();
}

function parseHex(raw) {
  const s = raw.trim();
  if (/^#[0-9a-fA-F]{6}$/.test(s)) return s.toUpperCase();
  if (/^[0-9a-fA-F]{6}$/.test(s)) return `#${s.toUpperCase()}`;
  return null;
}

const pickerEl = document.getElementById('picker');
const pickerSV = document.getElementById('pickerSV');
const pickerHue = document.getElementById('pickerHue');
const picker = { i: 0, h: 0, s: 1, v: 1, live: false };

function hsvHex() {
  return rgbToHex(...hsvToRgb(picker.h, picker.s, picker.v));
}

function drawSV() {
  const ctx = pickerSV.getContext('2d');
  const w = pickerSV.width, h = pickerSV.height;
  const [r, g, b] = hsvToRgb(picker.h, 1, 1);
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.fillRect(0, 0, w, h);
  const gw = ctx.createLinearGradient(0, 0, w, 0);
  gw.addColorStop(0, '#fff');
  gw.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gw;
  ctx.fillRect(0, 0, w, h);
  const gb = ctx.createLinearGradient(0, 0, 0, h);
  gb.addColorStop(0, 'rgba(0,0,0,0)');
  gb.addColorStop(1, '#000');
  ctx.fillStyle = gb;
  ctx.fillRect(0, 0, w, h);
  const x = picker.s * (w - 1), y = (1 - picker.v) * (h - 1);
  ctx.beginPath();
  ctx.arc(x, y, 6, 0, Math.PI * 2);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x, y, 7, 0, Math.PI * 2);
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function placePicker(anchor) {
  const r = anchor.getBoundingClientRect();
  const pw = pickerEl.offsetWidth || 200, ph = pickerEl.offsetHeight || 180;
  let left = r.right + 8, top = r.top;
  if (left + pw > window.innerWidth - 8) left = Math.max(8, r.left - pw - 8);
  if (top + ph > window.innerHeight - 8) top = Math.max(8, window.innerHeight - ph - 8);
  pickerEl.style.left = left + 'px';
  pickerEl.style.top = top + 'px';
}

function openPicker(i, anchor) {
  picker.i = i;
  [picker.h, picker.s, picker.v] = rgbToHsv(...hexToRgb(state.colors[i]));
  pickerHue.value = String(Math.round(picker.h));
  pickerEl.hidden = false;
  drawSV();
  placePicker(anchor);
}

function closePicker() {
  if (pickerEl.hidden) return;
  pickerEl.hidden = true;
  if (picker.live) {
    picker.live = false;
    savePalette(state.colors);
    refresh();
  }
}

function pickFromSV(e) {
  const r = pickerSV.getBoundingClientRect();
  picker.s = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  picker.v = Math.min(1, Math.max(0, 1 - (e.clientY - r.top) / r.height));
  picker.live = true;
  setColor(picker.i, hsvHex(), false);
  drawSV();
}

pickerSV.addEventListener('pointerdown', e => {
  pickerSV.setPointerCapture(e.pointerId);
  pickFromSV(e);
});
pickerSV.addEventListener('pointermove', e => {
  if (!pickerSV.hasPointerCapture(e.pointerId)) return;
  pickFromSV(e);
});
pickerHue.addEventListener('input', () => {
  picker.h = Number(pickerHue.value);
  picker.live = true;
  setColor(picker.i, hsvHex(), false);
  drawSV();
});

document.getElementById('swatches').addEventListener('click', e => {

  if (!sw || e.target.matches('input')) return;
  const edit = e.target.closest('.edit-color');
  state.brush = Number(sw.dataset.i);
  syncBrushSelection();
  if (edit) openPicker(state.brush, edit);
  else closePicker();
});

document.getElementById('brushRow').addEventListener('click', e => {
  const chip = e.target.closest('.brush-chip');
  if (!chip) return;
  state.brush = Number(chip.dataset.i);
  syncBrushSelection();
});

document.getElementById('swatches').addEventListener('change', e => {

  if (!hex) return;

  if (!parsed) { hex.value = state.colors[Number(hex.dataset.color)]; return; }

document.addEventListener('pointerdown', e => {

window.addEventListener('keydown', e => {

document.getElementById('order').addEventListener('change', e => {
  const v = e.target.value;
  const custom = v === 'custom';
  document.getElementById('customWrap').style.display = custom ? '' : 'none';
  resizeWall(() => {
    state.order = custom ? clampOrder(document.getElementById('customOrder').value) : Number(v);
    applyAspect('w');
  });
  syncSizeInputs();

function clampOrder(v) {
  return Math.min(10, Math.max(2, Math.round(Number(v) || 3)));
}

document.getElementById('customOrder').addEventListener('change', e => {
  resizeWall(() => {
    state.order = clampOrder(e.target.value);
    applyAspect('w');
  });
  e.target.value = state.order;
  syncSizeInputs();
  refresh();
});

// 「按原图比例」下，另一边跟着算。anchor 指哪一边是用户刚定下、不该被改的。
// 多图时「按原图比例」没有唯一答案，以第一张为准
function applyAspect(anchor) {
  if (state.fitMode !== 'match' || state.layers.length === 0) return;
  const { width: iw, height: ih } = state.layers[0].img;
  if (anchor === 'h') state.cubesX = snapCubes(gridH() * iw / ih);
  else state.cubesY = snapCubes(gridW() * ih / iw);
}

function onSizeInput(which) {
  return e => {
    state.sizeTouched = true;
    resizeWall(() => {
      const cubes = snapCubes(Number(e.target.value));
      if (which === 'w') state.cubesX = cubes; else state.cubesY = cubes;
      applyAspect(which);
    });
    syncSizeInputs();
    refresh();
  };
}
document.getElementById('width').addEventListener('change', onSizeInput('w'));
document.getElementById('height').addEventListener('change', onSizeInput('h'));

document.getElementById('fitMode').addEventListener('change', e => {
  state.fitMode = e.target.value;
  document.getElementById('padWrap').style.display = state.fitMode === 'contain' ? '' : 'none';
  document.getElementById('fitHint').textContent = t('fitHint.' + state.fitMode);
  resizeWall(() => applyAspect('w'));
  syncSizeInputs();
  refresh();
});

document.getElementById('padColor').addEventListener('change', e => {
  state.padColor = Number(e.target.value);
  refresh();
});

function renderPadOptions() {
  document.getElementById('padColor').innerHTML =
    colorNames().map((n, i) => `<option value="${i}" ${i === state.padColor ? 'selected' : ''}>${n}</option>`).join('');
}

document.getElementById('dither').addEventListener('input', e => {
  const pct = Number(e.target.value);
  document.getElementById('ditherVal').textContent = pct + '%';
  state.ditherStrength = pct / 100;
  refresh();
});

/* ---------- 手动上色 ---------- */
// 撤销栈存整张网格的快照。网格是每格 1 字节，即使 300×300 也只有 90KB，
// 比记录增量简单得多，也不怕漏记。
const HISTORY_LIMIT = 60;
const history = { undo: [], redo: [] };

function resetHistory() {
  history.undo.length = 0;
  history.redo.length = 0;
  syncHistoryButtons();
}

function pushHistory() {
  history.undo.push(state.grid.slice());
  if (history.undo.length > HISTORY_LIMIT) history.undo.shift();
  history.redo.length = 0;
  syncHistoryButtons();
}

function syncHistoryButtons() {
  document.getElementById('undo').disabled = history.undo.length === 0;
  document.getElementById('redo').disabled = history.redo.length === 0;
}

function stepHistory(from, to) {
  if (!state.grid || from.length === 0) return;
  to.push(state.grid.slice());
  state.grid = from.pop();
  syncHistoryButtons();
  repaint();
}

document.getElementById('undo').addEventListener('click', () => stepHistory(history.undo, history.redo));
document.getElementById('redo').addEventListener('click', () => stepHistory(history.redo, history.undo));

window.addEventListener('keydown', e => {
  if (!(e.metaKey || e.ctrlKey) || e.key.toLowerCase() !== 'z') return;
  e.preventDefault();
  if (e.shiftKey) stepHistory(history.redo, history.undo);
  else stepHistory(history.undo, history.redo);
});

document.getElementById('tools').addEventListener('click', e => {
  const btn = e.target.closest('button[data-tool]');
  if (!btn) return;
  state.tool = btn.dataset.tool;
  [...e.currentTarget.children].forEach(b => b.classList.toggle('active', b === btn));
  document.getElementById('toolHint').textContent = t('toolHint.' + state.tool);
  canvas.style.cursor = state.tool === 'brush' ? 'crosshair' : 'cell';
});

// 相连同色区域：四邻域漫延，用显式栈避免大面积时递归爆栈
function floodFill(sx, sy, to) {
  const W = gridW(), H = gridH();
  const from = state.grid[sy * W + sx];
  if (from === to) return false;
  const stack = [sy * W + sx];
  while (stack.length) {
    const i = stack.pop();
    if (state.grid[i] !== from) continue;
    state.grid[i] = to;
    const x = i % W, y = (i - x) / W;
    if (x > 0) stack.push(i - 1);
    if (x < W - 1) stack.push(i + 1);
    if (y > 0) stack.push(i - W);
    if (y < H - 1) stack.push(i + W);
  }
  return true;
}

function replaceAll(sx, sy, to) {
  const from = state.grid[sy * gridW() + sx];
  if (from === to) return false;
  for (let i = 0; i < state.grid.length; i++) if (state.grid[i] === from) state.grid[i] = to;
  return true;
}

function fillRect(a, b, to) {
  const W = gridW();
  const x0 = Math.min(a.x, b.x), x1 = Math.max(a.x, b.x);
  const y0 = Math.min(a.y, b.y), y1 = Math.max(a.y, b.y);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) state.grid[y * W + x] = to;
}

// 指针事件是离散采样的，快速拖动时两次事件可能隔着好几格，直接补一条直线
function paintLine(a, b) {
  const W = gridW();
  const steps = Math.max(Math.abs(b.x - a.x), Math.abs(b.y - a.y));
  for (let s = 0; s <= steps; s++) {
    const t = steps === 0 ? 0 : s / steps;
    const x = Math.round(a.x + (b.x - a.x) * t);
    const y = Math.round(a.y + (b.y - a.y) * t);
    state.grid[y * W + x] = state.brush;
  }
}

function cellAt(e) {
  const r = canvas.getBoundingClientRect();
  const scale = canvas.width / r.width;
  const x = Math.floor((e.clientX - r.left) * scale / previewCell);
  const y = Math.floor((e.clientY - r.top) * scale / previewCell);
  if (x < 0 || y < 0 || x >= gridW() || y >= gridH()) return null;
  return { x, y };
}

let drag = null;   // 进行中的拖拽：矩形选区、画笔涂抹或图层操作

// 排版模式下把图层边界画出来，选中的那个加把手
function drawLayerOverlay() {
  const cell = previewCell;
  for (const L of state.layers) {
    const sel = L.id === state.selected;
    ctx.lineWidth = sel ? 3 : 2;
    ctx.setLineDash(sel ? [] : [5, 4]);
    ctx.strokeStyle = sel ? '#2f7de1' : 'rgba(20,20,20,.55)';
    ctx.strokeRect(L.x * cell, L.y * cell, L.w * cell, L.h * cell);
    ctx.setLineDash([]);
    if (!sel) continue;
    ctx.fillStyle = '#2f7de1';
    for (const [hx, hy] of [[L.x, L.y], [L.x + L.w, L.y], [L.x, L.y + L.h], [L.x + L.w, L.y + L.h]]) {
      ctx.fillRect(hx * cell - HANDLE / 2, hy * cell - HANDLE / 2, HANDLE, HANDLE);
    }
  }
}

function repaint() {
  if (!state.grid) return;
  drawGrid(ctx, previewCell);
  if (state.mode === 'layout') drawLayerOverlay();
  if (!drag || !drag.a) return;   // 画笔拖动没有选区，不画预览框
  const x0 = Math.min(drag.a.x, drag.b.x), x1 = Math.max(drag.a.x, drag.b.x);
  const y0 = Math.min(drag.a.y, drag.b.y), y1 = Math.max(drag.a.y, drag.b.y);
  const px = x0 * previewCell, py = y0 * previewCell;
  const pw = (x1 - x0 + 1) * previewCell, ph = (y1 - y0 + 1) * previewCell;
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = state.colors[state.brush];
  ctx.fillRect(px, py, pw, ph);
  ctx.restore();
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 4]);
  ctx.strokeStyle = '#111';
  ctx.strokeRect(px + 1, py + 1, pw - 2, ph - 2);
  ctx.setLineDash([]);
}

const HANDLE = 10;   // 把手命中范围，单位是屏幕像素

// 鼠标位置换算成贴纸坐标（浮点，排版需要亚格精度）
function pointAt(e) {
  const r = canvas.getBoundingClientRect();
  const scale = canvas.width / r.width;
  return { x: (e.clientX - r.left) * scale / previewCell, y: (e.clientY - r.top) * scale / previewCell };
}

function hitLayer(p) {
  // 从上往下找，先命中盖在最上面的
  for (let i = state.layers.length - 1; i >= 0; i--) {
    const L = state.layers[i];
    if (p.x >= L.x && p.x <= L.x + L.w && p.y >= L.y && p.y <= L.y + L.h) return L;
  }
  return null;
}

function hitHandle(p, L) {
  if (!L) return null;
  const tol = HANDLE / previewCell * (canvas.width / canvas.getBoundingClientRect().width);
  const near = (a, b) => Math.abs(a - b) <= tol;
  const left = near(p.x, L.x), right = near(p.x, L.x + L.w);
  const top = near(p.y, L.y), bottom = near(p.y, L.y + L.h);
  if ((left || right) && (top || bottom)) return { left, top };
  return null;
}

canvas.addEventListener('pointerdown', e => {
  if (!state.grid) return;

  if (state.mode === 'layout') {
    const p = pointAt(e);
    const sel = activeLayer();
    const handle = hitHandle(p, sel);
    const L = handle ? sel : hitLayer(p);
    if (!L) return;
    canvas.setPointerCapture(e.pointerId);
    state.selected = L.id;
    renderLayers();
    drag = {
      layer: L, start: p, handle,
      orig: { x: L.x, y: L.y, w: L.w, h: L.h, ox: L.ox, oy: L.oy },
      crop: state.layoutTool === 'crop' && !handle,
    };
    repaint();
    return;
  }

  const c = cellAt(e);
  if (!c) return;
  canvas.setPointerCapture(e.pointerId);
  pushHistory();

  if (state.tool === 'rect') {
    drag = { a: c, b: c };
    repaint();
    return;
  }
  let changed;
  if (state.tool === 'brush') {
    drag = { brush: true, last: c };
    changed = state.grid[c.y * gridW() + c.x] !== state.brush;
    state.grid[c.y * gridW() + c.x] = state.brush;
  } else if (state.tool === 'fill') {
    changed = floodFill(c.x, c.y, state.brush);
  } else {
    changed = replaceAll(c.x, c.y, state.brush);
  }
  if (!changed) history.undo.pop();   // 点了但没改动，不该占一格撤销
  syncHistoryButtons();
  repaint();
});

canvas.addEventListener('pointermove', e => {
  if (!drag) return;

  if (drag.layer) {
    const p = pointAt(e);
    const dx = p.x - drag.start.x, dy = p.y - drag.start.y;
    const L = drag.layer, o = drag.orig;
    if (drag.crop) {
      L.ox = o.ox + dx;
      L.oy = o.oy + dy;
    } else if (drag.handle) {
      // 拖角改大小：动的是被拖那一侧，对侧固定
      const x0 = drag.handle.left ? Math.round(o.x + dx) : o.x;
      const y0 = drag.handle.top ? Math.round(o.y + dy) : o.y;
      const x1 = drag.handle.left ? o.x + o.w : Math.round(o.x + o.w + dx);
      const y1 = drag.handle.top ? o.y + o.h : Math.round(o.y + o.h + dy);
      L.x = Math.min(x0, x1); L.w = Math.max(1, Math.abs(x1 - x0));
      L.y = Math.min(y0, y1); L.h = Math.max(1, Math.abs(y1 - y0));
    } else {
      L.x = Math.round(o.x + dx);
      L.y = Math.round(o.y + dy);
    }
    quantize();          // 排版时实时重算，所见即所得
    repaint();
    return;
  }

  const c = cellAt(e);
  if (!c) return;
  if (drag.brush) {
    paintLine(drag.last, c);   // 补上两次事件之间跳过的格子
    drag.last = c;
    repaint();
  } else {
    drag.b = c;
    repaint();
  }
});

canvas.addEventListener('pointerup', () => {
  if (!drag) return;
  if (drag.layer) {
    drag = null;
    resetHistory();   // 排版改了图，旧的上色快照对不上了
    repaint();
    return;
  }
  if (!drag.brush) {
    const { a, b } = drag;
    drag = null;
    fillRect(a, b, state.brush);
  }
  drag = null;
  repaint();
});

/* ---------- 图层与排版 ---------- */
function renderLayers() {
  const list = document.getElementById('layerList');
  document.getElementById('layerEmpty').hidden = state.layers.length > 0;
  // 后加的图层盖在上面，列表里倒过来显示，和视觉层叠顺序一致
  list.innerHTML = [...state.layers].reverse().map(L => `
    <div class="layer ${L.id === state.selected ? 'selected' : ''}" data-id="${L.id}">
      <img src="${L.img.src}" alt="">
      <span class="lname" title="${L.name}">${L.name}</span>
      <button data-act="up" title="${t('layerUp')}">↑</button>
      <button data-act="down" title="${t('layerDown')}">↓</button>
      <button data-act="del" title="${t('layerDel')}">✕</button>
    </div>`).join('');
  syncCropControls();
}

function syncCropControls() {
  const L = activeLayer();
  document.getElementById('cropWrap').style.display =
    state.layoutTool === 'crop' && L ? '' : 'none';
  if (!L) return;
  document.getElementById('zoom').value = Math.round(L.zoom * 100);
  document.getElementById('zoomVal').textContent = Math.round(L.zoom * 100) + '%';
}

document.getElementById('layerList').addEventListener('click', e => {
  const row = e.target.closest('.layer');
  if (!row) return;
  const i = state.layers.findIndex(l => l.id === row.dataset.id);
  if (i < 0) return;
  const act = e.target.closest('button')?.dataset.act;

  if (act === 'del') {
    URL.revokeObjectURL(state.layers[i].img.src);
    state.layers.splice(i, 1);
    if (state.selected === row.dataset.id) state.selected = state.layers.at(-1)?.id ?? null;
  } else if (act === 'up' && i < state.layers.length - 1) {
    state.layers.splice(i + 1, 0, state.layers.splice(i, 1)[0]);
  } else if (act === 'down' && i > 0) {
    state.layers.splice(i - 1, 0, state.layers.splice(i, 1)[0]);
  } else {
    state.selected = row.dataset.id;
  }
  renderLayers();
  refresh();
});

// 把所有图层均分到墙上。整数取整保证不留缝也不重叠。
function arrange(kind) {
  const n = state.layers.length;
  if (n === 0 || kind === 'keep') return;
  const W = gridW(), H = gridH();
  let cols, rows;
  if (kind === 'full') { cols = 1; rows = 1; }
  else if (kind === 'row') { cols = n; rows = 1; }
  else if (kind === 'col') { cols = 1; rows = n; }
  else { cols = Math.ceil(Math.sqrt(n)); rows = Math.ceil(n / cols); }

  state.layers.forEach((L, i) => {
    if (kind === 'full') { Object.assign(L, { x: 0, y: 0, w: W, h: H }); return; }
    const cx = i % cols, cy = Math.floor(i / cols);
    const x0 = Math.round(cx * W / cols), x1 = Math.round((cx + 1) * W / cols);
    const y0 = Math.round(cy * H / rows), y1 = Math.round((cy + 1) * H / rows);
    Object.assign(L, { x: x0, y: y0, w: Math.max(1, x1 - x0), h: Math.max(1, y1 - y0) });
    L.ox = 0; L.oy = 0;
  });
}

document.querySelectorAll('[data-arrange]').forEach(btn => {
  btn.addEventListener('click', () => {
    if (state.layers.length === 0) { alert(t('alertAddImage')); return; }
    arrange(btn.dataset.arrange);
    refresh();
  });
});

function setMode(mode) {
  state.mode = mode;
  canvas.style.cursor = mode === 'layout' ? 'move' : 'crosshair';
  repaint();
}

function setPane(pane) {
  document.querySelectorAll('#paneTabs button').forEach(b => {
    const on = b.dataset.pane === pane;
    b.classList.toggle('active', on);
    b.setAttribute('aria-expanded', String(on));
  });
  document.querySelectorAll('.pane').forEach(p => {
    p.classList.toggle('is-open', p.dataset.pane === pane);
  });
  if (pane === 'layout') setMode('layout');
  else if (pane === 'paint') setMode('paint');
}

document.getElementById('paneTabs').addEventListener('click', e => {
  const btn = e.target.closest('button[data-pane]');
  if (!btn) return;
  setPane(btn.dataset.pane);
});

document.getElementById('layoutTools').addEventListener('click', e => {
  const btn = e.target.closest('button[data-ltool]');
  if (!btn) return;
  state.layoutTool = btn.dataset.ltool;
  [...e.currentTarget.children].forEach(b => b.classList.toggle('active', b === btn));
  document.getElementById('ltoolHint').textContent = t('ltoolHint.' + state.layoutTool);
  syncCropControls();
  repaint();
});

document.getElementById('zoom').addEventListener('input', e => {
  const L = activeLayer();
  if (!L) return;
  L.zoom = Number(e.target.value) / 100;
  document.getElementById('zoomVal').textContent = e.target.value + '%';
  refresh();
});

document.getElementById('resetCrop').addEventListener('click', () => {
  const L = activeLayer();
  if (!L) return;
  L.zoom = 1; L.ox = 0; L.oy = 0;
  syncCropControls();
  refresh();
});

canvas.addEventListener('wheel', e => {
  if (state.mode !== 'layout' || state.layoutTool !== 'crop') return;
  const L = activeLayer();
  if (!L) return;
  e.preventDefault();
  L.zoom = Math.min(4, Math.max(0.2, L.zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08)));
  syncCropControls();
  refresh();
}, { passive: false });

function pinchDist(e) {
  const a = e.touches[0], b = e.touches[1];
  return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
}
let pinch = null;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length !== 2 || state.mode !== 'layout' || state.layoutTool !== 'crop') return;
  const L = activeLayer();
  if (!L) return;
  e.preventDefault();
  drag = null;
  pinch = { dist: pinchDist(e), zoom: L.zoom };
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  if (!pinch || e.touches.length < 2) return;
  const L = activeLayer();
  if (!L) return;
  e.preventDefault();
  L.zoom = Math.min(4, Math.max(0.2, pinch.zoom * (pinchDist(e) / pinch.dist)));
  syncCropControls();
  refresh();
}, { passive: false });
canvas.addEventListener('touchend', e => {
  if (e.touches.length < 2) pinch = null;
});

/* ---------- 图片载入 ---------- */
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('over');
  addFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });

async function loadImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    // 不在这里释放 URL：图层列表的缩略图还要读它，等删除图层时再释放
    return img;
  } catch (e) {
    URL.revokeObjectURL(url);
    throw e;
  }
}

async function addFiles(files) {
  const images = [...files].filter(f => f.type.startsWith('image/'));
  if (images.length === 0) { alert(t('alertChooseImage')); return; }

  const wasEmpty = state.layers.length === 0;
  for (const file of images) {
    try {
      state.layers.push(newLayer(await loadImage(file), file.name));
    } catch {
      alert(t('alertSkip', { name: file.name }));
    }
  }
  if (state.layers.length === 0) return;

  state.selected = state.layers[state.layers.length - 1].id;
  // 一次加多张就自动排方阵，省得用户手动摆；单张则铺满
  if (state.layers.length > 1) arrange(wasEmpty ? 'grid' : 'keep');
  applyAspect('w');
  syncSizeInputs();
  renderLayers();
  refresh();
}

/* ---------- 导出按钮 ---------- */
document.getElementById('download').addEventListener('click', () => {
  if (!state.grid) { alert(t('alertUploadFirst')); return; }
  const sheet = buildSheet();
  const a = document.createElement('a');
  a.download = `cubewall-${gridW()}x${gridH()}-n${state.order}.png`;
  a.href = sheet.toDataURL('image/png');
  a.click();
});

document.getElementById('print').addEventListener('click', () => {
  if (!state.grid) { alert(t('alertUploadFirst')); return; }
  const sheet = buildSheet();
  const img = document.getElementById('printSheet');
  let printed = false;
  const go = () => {
    if (printed) return;
    printed = true;
    img.onload = null;
    window.print();
  };
  img.onload = go;
  img.src = sheet.toDataURL('image/png');
  if (img.complete) go();
});

function applyLang() {
  applyStaticLang();
  renderSwatches();
  renderPadOptions();
  renderLayers();
  document.getElementById('toolHint').textContent = t('toolHint.' + state.tool);
  document.getElementById('fitHint').textContent = t('fitHint.' + state.fitMode);
  document.getElementById('ltoolHint').textContent = t('ltoolHint.' + state.layoutTool);
  renderPreview();
}

document.getElementById('langSwitch').addEventListener('click', e => {
  const btn = e.target.closest('button[data-lang]');
  if (!btn || btn.dataset.lang === lang) return;
  lang = btn.dataset.lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch { /* 隐私模式：仅本次会话 */ }
  applyLang();
});

document.getElementById('themeSwitch').addEventListener('click', e => {
  const btn = e.target.closest('button[data-theme]');
  if (!btn || btn.dataset.theme === themePref) return;
  themePref = btn.dataset.theme;
  applyTheme();
});

/* ---------- 启动 ---------- */
applyTheme();
applyLang();
syncSizeInputs();
setPane('setup');
canvas.style.cursor = 'move';
</script>
</body>
</html>
